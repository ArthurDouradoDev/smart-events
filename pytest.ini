[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Mantém os artefatos transitórios do pytest fora da raiz do projeto.
addopts = --basetemp=.tmp/pytest
cache_dir = .tmp/pytest-cache

markers =
    vpn: testes de integração que requerem conexão VPN ativa com o iManager OSS

# Suprime o aviso de SSL do urllib3 ao testar com certificados auto-assinados
filterwarnings =
    ignore::urllib3.exceptions.InsecureRequestWarning
